<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f5eee4"><meta name="description" content="Some of YOZA's art."><title>Some of my art — YOZA</title><link rel="stylesheet" href="style.css"></head><body><header class="topbar"><div class="wrap nav"><a class="logo brand" href="index.html"><span>YO<span>Z</span>A</span></a><button class="menu" id="menu" aria-label="Toggle menu">MENU</button><nav class="links" id="links"><a href="index.html">Home</a><a href="gallery.html" aria-current="page">Gallery</a><a href="shop.html">Shop</a><a href="faq.html">FAQ</a><a href="contact.html">Contact</a></nav></div></header><main><section class="page-hero"><div class="wrap"><h1>Some of my art.</h1><p>Have a look around.</p></div></section><section class="page-content"><div class="wrap"><div class="gallery-grid" id="gallery-grid" aria-live="polite"></div><div class="gallery-more-wrap" id="gallery-more-wrap" hidden><button class="btn secondary" id="load-more" type="button">Load more artwork</button></div><p class="gallery-empty" id="gallery-empty">Your artwork will appear here soon.</p></div></section></main><a class="gallery-float-cta" href="contact.html">Get your commission <span aria-hidden="true">↗</span></a><footer><div class="wrap footer-row"><span>© <span class="year"></span> YOZA. Made with feeling.</span><span>ART · IDEAS · LITTLE STORIES</span></div></footer><script>const menu=document.getElementById('menu'),links=document.getElementById('links');if(menu&&links){menu.addEventListener('click',()=>links.classList.toggle('open'));links.querySelectorAll('a').forEach(a=>a.addEventListener('click',()=>links.classList.remove('open')))}document.querySelectorAll('.year').forEach(el=>el.textContent=new Date().getFullYear());
const artworks = [
  { src: "art contest till finals.jpg", title: "Art Contest Till Finals", category: "Illustration" },
];
const galleryGrid = document.getElementById('gallery-grid');
const loadMoreWrap = document.getElementById('gallery-more-wrap');
const loadMoreButton = document.getElementById('load-more');
const galleryEmpty = document.getElementById('gallery-empty');
const pageSize = 12;
let visibleCount = 0;
function renderArtworks() {
  const nextBatch = artworks.slice(visibleCount, visibleCount + pageSize);
  nextBatch.forEach((art, index) => {
    const card = document.createElement('article');
    card.className = 'gallery-card';
    const imageWrap = document.createElement('div');
    imageWrap.className = 'gallery-image';
    const image = document.createElement('img');
    image.src = art.src;
    image.alt = art.title || 'Artwork by YOZA';
    image.loading = 'lazy';
    image.decoding = 'async';
    imageWrap.appendChild(image);
    const meta = document.createElement('div');
    meta.className = 'gallery-meta';
    const title = document.createElement('strong');
    title.textContent = art.title || 'Untitled piece';
    const category = document.createElement('span');
    category.textContent = art.category || 'Artwork';
    meta.append(title, category);
    card.append(imageWrap, meta);
    galleryGrid.appendChild(card);
  });
  visibleCount += nextBatch.length;
  galleryEmpty.hidden = artworks.length > 0;
  loadMoreWrap.hidden = visibleCount >= artworks.length;
}
loadMoreButton.addEventListener('click', renderArtworks);
renderArtworks();
</script></body></html>
