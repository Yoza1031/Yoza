<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f5eee4"><meta name="description" content="Some of YOZA's art."><title>Some of my art — YOZA</title><link rel="stylesheet" href="style.css"></head><body><header class="topbar"><div class="wrap nav"><a class="logo brand" href="index.html"><span>YO<span>Z</span>A</span></a><button class="menu" id="menu" aria-label="Toggle menu">MENU</button><nav class="links" id="links"><a href="index.html">Home</a><a href="gallery.html" aria-current="page">Gallery</a><a href="shop.html">Shop</a><a href="faq.html">FAQ</a><a href="contact.html">Contact</a></nav></div></header><main><section class="page-hero"><div class="wrap"><h1>Some of my art.</h1><p>Have a look around.</p></div></section><section class="page-content"><div class="wrap"><div class="gallery-grid" id="gallery-grid" aria-live="polite"></div><div class="gallery-more-wrap" id="gallery-more-wrap" hidden><button class="btn secondary" id="load-more" type="button">Load more artwork</button></div><p class="gallery-empty" id="gallery-empty">Your artwork will appear here soon.</p></div></section></main><a class="gallery-float-cta" href="contact.html">Get your commission <span aria-hidden="true">↗</span></a><div class="art-lightbox" id="art-lightbox" role="dialog" aria-modal="true" aria-label="Artwork preview" aria-hidden="true" hidden><button class="art-lightbox-close" id="art-lightbox-close" type="button" aria-label="Close artwork preview">×</button><figure class="art-lightbox-figure"><img id="art-lightbox-image" alt=""><figcaption id="art-lightbox-caption"></figcaption></figure></div><footer><div class="wrap footer-row"><span>© <span class="year"></span> YOZA. Made with feeling.</span><span>ART · IDEAS · LITTLE STORIES</span></div></footer><script>const menu=document.getElementById('menu'),links=document.getElementById('links');if(menu&&links){menu.addEventListener('click',()=>links.classList.toggle('open'));links.querySelectorAll('a').forEach(a=>a.addEventListener('click',()=>links.classList.remove('open')))}document.querySelectorAll('.year').forEach(el=>el.textContent=new Date().getFullYear());
const artworks = [
  { src: "art contest till finals.jpg", title: "Study in the Out", category: "Illustration" },
  { src: "artworks/Bored Santa Hat Holiday Doodles-2.png", title: "Bored Santa Hat Holiday Doodles", category: "Holiday Illustration" },
];
const galleryGrid = document.getElementById('gallery-grid');
const loadMoreWrap = document.getElementById('gallery-more-wrap');
const loadMoreButton = document.getElementById('load-more');
const galleryEmpty = document.getElementById('gallery-empty');
const pageSize = 12;
let visibleCount = 0;
const lightbox = document.getElementById('art-lightbox');
const lightboxImage = document.getElementById('art-lightbox-image');
const lightboxCaption = document.getElementById('art-lightbox-caption');
const lightboxClose = document.getElementById('art-lightbox-close');
let lastFocusedElement = null;
function openArtwork(art, trigger) {
  lastFocusedElement = trigger;
  lightboxImage.src = art.src;
  lightboxImage.alt = art.title || 'Artwork by YOZA';
  lightboxCaption.textContent = [art.title || 'Untitled piece', art.category || 'Artwork'].join(' · ');
  lightbox.hidden = false;
  lightbox.setAttribute('aria-hidden', 'false');
  document.body.classList.add('lightbox-open');
  lightboxClose.focus();
}
function closeArtwork() {
  if (lightbox.hidden) return;
  lightbox.hidden = true;
  lightbox.setAttribute('aria-hidden', 'true');
  lightboxImage.removeAttribute('src');
  document.body.classList.remove('lightbox-open');
  if (lastFocusedElement) lastFocusedElement.focus();
}
lightboxClose.addEventListener('click', closeArtwork);
lightbox.addEventListener('click', event => { if (event.target === lightbox) closeArtwork(); });
document.addEventListener('keydown', event => {
  if (!lightbox.hidden && event.key === 'Escape') closeArtwork();
});
function renderArtworks() {
  const nextBatch = artworks.slice(visibleCount, visibleCount + pageSize);
  nextBatch.forEach((art, index) => {
    const card = document.createElement('article');
    card.className = 'gallery-card';
    const imageWrap = document.createElement('button');
    imageWrap.type = 'button';
    imageWrap.className = 'gallery-image gallery-image-button';
    imageWrap.setAttribute('aria-label', 'View ' + (art.title || 'artwork') + ' full screen');
    imageWrap.addEventListener('click', () => openArtwork(art, imageWrap));
    const image = document.createElement('img');
    const rawArtworkUrl = new URL(art.src, 'https://raw.githubusercontent.com/Yoza1031/Yoza/main/').href;
    const optimizedPreview = 'https://images.weserv.nl/?url=' + encodeURIComponent(rawArtworkUrl) + '&w=1100&q=78&output=webp';
    image.src = optimizedPreview;
    image.onerror = () => { if (image.src !== rawArtworkUrl) image.src = rawArtworkUrl; };
    image.fetchPriority = 'low';
    image.alt = art.title || 'Artwork by YOZA';
    image.loading = 'lazy';
    image.decoding = 'async';
    image.style.aspectRatio = '4 / 5';
    const markLandscape = () => {
      if (image.naturalWidth > image.naturalHeight * 1.45) card.classList.add('gallery-card--landscape');
    };
    image.addEventListener('load', markLandscape, { once: true });
    if (image.complete) markLandscape();
    imageWrap.appendChild(image);
    const meta = document.createElement('div');
    meta.className = 'gallery-meta';
    const title = document.createElement('strong');
    title.textContent = art.title || 'Untitled piece';
    const category = document.createElement('span');
    category.textContent = art.category || 'Artwork';
    meta.append(title, category);
    card.append(imageWrap, meta);
    galleryGrid.appendChild(card);
  });
  visibleCount += nextBatch.length;
  galleryEmpty.hidden = artworks.length > 0;
  loadMoreWrap.hidden = visibleCount >= artworks.length;
}
loadMoreButton.addEventListener('click', renderArtworks);
renderArtworks();
</script></body></html>
